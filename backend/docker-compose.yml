version: "3"
services:
  flutter:
    build: ./php
    image: flutter_php:latest
    container_name: flutter
    hostname: "flutter"
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    working_dir: /var/www/html
    depends_on:
      - flutterdb
      - fluttermongo
  flutterdb:
    image: mariadb:10.2
    container_name: flutterdb
    restart: unless-stopped
    tty: true
    ports:
      - "33306:3306"
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/conf.d:/etc/mysql/conf.d:ro
    environment:
      MYSQL_USER: lowfreq
      MYSQL_PASSWORD: p455w0rd1!.
      MYSQL_ROOT_PASSWORD: p455w0rd
      TZ: Asia/Jakarta
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
  fluttermongo:
    image: mongo:latest 
    container_name: fluttermongo
    restart: unless-stopped
    ports:
      - "27017:27017" 
    volumes:
      - ./mongo/data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: lowfreq
      MONGO_INITDB_ROOT_PASSWORD: p455w0rd1!.
      TZ: Asia/Jakarta
  nginx_hybrid_db:
    build: ./nginx
    image: nginx_hybrid_db:latest
    container_name: nginx_hybrid_db
    hostname: "nginx_hybrid_db"
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flutter